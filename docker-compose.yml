version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: python run_backend.py
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///./naturaldub.db
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: python run_frontend.py
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: naturaldub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
